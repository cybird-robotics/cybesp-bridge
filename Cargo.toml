[package]
name = "cybesp-bridge"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = ["utadr"]

[[bin]]
name = "cybesp-bridge"
path = "./src/bin/main.rs"

[features]
default = ["board-waveshare"]
# Boards: enable exactly one (checked by build.rs). Each selects a file in
# src/board/ that owns that board's UARTs, pins, LED and antenna setup.
# Waveshare ESP32-C6-Zero: WS2812 RGB LED on GPIO8, RTCM TX on GPIO14.
board-waveshare = ["dep:esp-hal-smartled", "dep:smart-leds", "dep:rgb"]
# Seeed XIAO ESP32-C6: monochrome LED on GPIO15, RTCM TX on GPIO0,
# antenna switch on GPIO3/GPIO14.
board-xiao-c6 = []

# Board options. A board without the hardware rejects the option at compile
# time.
# XIAO: use the external u.FL antenna instead of the built-in one. Only with an
# antenna fitted — see docs/board_info.md.
ext-antenna = []

[dependencies]
# ESP32-C6 HAL
esp-hal = { version = "~1.0", features = ["esp32c6", "unstable", "log-04"] }

# Embassy async runtime for ESP
esp-rtos = { version = "0.2.0", features = [
    "esp32c6",
    "embassy",
    "esp-radio",
    "esp-alloc",
    "log-04",
] }

# Bootloader app descriptor
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6"] }

# WiFi driver
esp-radio = { version = "0.17.0", features = [
    "esp32c6",
    "wifi",
    "smoltcp",
    "esp-alloc",
    "unstable",
    "log-04",
] }

# Embassy async
embassy-executor = { version = "0.9.1" }
embassy-time = { version = "0.5.0" }
embassy-futures = "0.1"
embassy-sync = "0.7"

# Shared wire definitions (downlink batch envelope). `no_std`, no deps.
cybflight-msgs = { path = "../cybflight-msgs", default-features = false }

# Networking
embassy-net = { version = "0.7.1", features = [
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "log",
] }

smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "proto-ipv4",
    "socket-udp",
    "log",
] }

# Heap allocator (required by WiFi)
esp-alloc = { version = "0.9.0" }

# Logging (log crate via USB serial)
log = "0.4"
# USB serial/JTAG only. The default `auto` printer falls back to UART0 when no
# USB host has ever been attached — and UART0 (GPIO16/17) is the STM32 link, so
# every log line would be injected into the flight controller's uplink. Also
# drops the `critical-section` feature, which masked interrupts per print and
# would stall the high-priority UART tasks.
esp-println = { version = "0.16.1", default-features = false, features = ["esp32c6", "log-04", "jtag-serial"] }
esp-backtrace = { version = "0.18.1", features = ["esp32c6", "panic-handler", "println"] }

# I/O traits
embedded-io = "0.7"
embedded-io-async = "0.7"

# Addressable LED (WS2812 on GPIO8) — Waveshare board only
esp-hal-smartled = { version = "0.17.0", optional = true }
smart-leds = { version = "0.4.0", optional = true }
rgb = { version = "0.8", default-features = false, optional = true }

# COBS framing (same version as cybflight STM32 firmware)
cobs = { version = "0.5", default-features = false }

# Static allocation
static_cell = "2.1.1"
critical-section = "1.2.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
