name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [board-waveshare, board-xiao-c6]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --locked --no-default-features --features ${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          path: target/riscv32imac-unknown-none-elf/release/cybesp-bridge
